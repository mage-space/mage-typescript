name: Smoke test

# Runs one real generation against api.mage.space every night with the
# MAGE_API_KEY secret: the cheapest image model at its default settings.
# Without the secret, it does nothing.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAGE_API_KEY: ${{ secrets.MAGE_API_KEY }}
    steps:
      - name: Check for an API key
        id: key
        run: |
          if [ -z "$MAGE_API_KEY" ]; then
            echo "::notice::The MAGE_API_KEY secret is not set, so the smoke test is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: |
          npm ci
          npm run build
          npm run smoke

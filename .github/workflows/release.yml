name: Release

# release-please keeps a release pull request open from the conventional
# commits on main. Merging it tags the release and publishes it to npm through
# trusted publishing, which adds provenance.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    # Idle until the release bot is configured (see CONTRIBUTING.md).
    if: vars.MAGE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create a bot token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAGE_BOT_APP_ID }}
          private-key: ${{ secrets.MAGE_BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm publish --access public
